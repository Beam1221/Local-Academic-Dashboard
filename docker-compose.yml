name: studyspace
services:
  backend:
    build: ./backend
    environment:
      DATA_DIR: /data
    volumes:
      - academic-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  frontend:
    build: ./frontend
    ports:
      - "${HOST_BIND:-127.0.0.1}:${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  academic-data:
